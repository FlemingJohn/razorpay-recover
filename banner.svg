<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDescription">
  <title id="bannerTitle">Razorpay Recover</title>
  <desc id="bannerDescription">A phone call from the Razorpay agent turns a failed autopay into a recovered payment.</desc>
  <rect width="1200" height="320" fill="#f5f6f8"/>
  <rect x="16" y="16" width="1168" height="288" rx="22" fill="#ffffff" stroke="#e4e7ed" stroke-width="2"/>

  <rect x="64" y="60" width="52" height="52" rx="16" fill="#2f6bff"/>
  <path transform="translate(77 73) scale(1.1)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>

  <text x="64" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#111827">Razorpay Recover</text>
  <text x="64" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#6b7280">A friendly voice call that wins back failed autopay payments.</text>
  <text x="64" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a47c4">Call. Listen. Send a secure link. Done.</text>

  <g transform="translate(690 70)">
    <rect x="0" y="20" width="110" height="110" rx="22" fill="#fadfe4"/>
    <circle cx="55" cy="75" r="27" fill="none" stroke="#bc3348" stroke-width="6"/>
    <path d="M55 62v16M55 88v1" fill="none" stroke="#bc3348" stroke-width="6" stroke-linecap="round"/>
    <text x="55" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bc3348">Autopay failed</text>

    <path d="M126 75h32m-10-10 10 10-10 10" fill="none" stroke="#2f6bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="176" y="0" width="100" height="150" rx="24" fill="#e3ecff" stroke="#2f6bff" stroke-width="3"/>
    <path d="M204 75v0M217 62v26M230 50v50M243 62v26M256 75v0" fill="none" stroke="#2f6bff" stroke-width="6" stroke-linecap="round"/>
    <text x="226" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1a47c4">Razorpay agent calls</text>

    <path d="M296 75h32m-10-10 10 10-10 10" fill="none" stroke="#2f6bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="346" y="20" width="110" height="110" rx="22" fill="#ddf3ea"/>
    <circle cx="401" cy="75" r="27" fill="none" stroke="#12805c" stroke-width="6"/>
    <path d="m388 76 9 9 17-19" fill="none" stroke="#12805c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="401" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#12805c">Payment recovered</text>
  </g>
